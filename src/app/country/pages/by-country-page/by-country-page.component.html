<!-- country-search-input -->
<country-search-input placeholder="Buscar por país" (value)="query.set($event)" />

<!-- country-list -->
<country-list [countries]="countryResource.value() ?? []" [errorMessage]="countryResource.error()" [isEmpty]="countryResource.value()?.length===0" [isLoading]="countryResource.isLoading()"></country-list>
